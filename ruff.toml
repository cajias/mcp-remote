# Ruff configuration
line-length = 120
target-version = "py38"
extend-exclude = ["docs/*", "tests/*"]

[lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "ANN", # annotations
    "S",   # bandit
    "B",   # bugbear
    "C4",  # comprehensions
    "RUF", # ruff specific
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"src/*" = ["ANN401"]
"tests/*" = ["S101", "ANN201"]
"src/mpc_remote/__init__.py" = ["F401"]
